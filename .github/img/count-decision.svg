  <rect class="band" x="446" y="100" width="22" height="12"/>
  <rect class="band" x="446" y="100" width="22" height="12"/>
  <text class="ink" x="476" y="110">at least 0.2</text>
  <rect class="band" x="446" y="118" width="22" height="12"/>
  <rect class="band" x="446" y="118" width="22" height="12"/>
