  <path class="axis" d="M432 62 V244 H872"/>
  <text class="ink" x="432.0" y="261" text-anchor="middle">1</text>
  <text class="ink" x="578.7" y="261" text-anchor="middle">10</text>
  <text class="ink" x="725.3" y="261" text-anchor="middle">100</text>
  <text class="ink" x="872.0" y="261" text-anchor="middle">1000</text>
  <text class="ink" x="424" y="234.9" text-anchor="end">1</text>
  <text class="ink" x="424" y="150.5" text-anchor="end">10</text>
  <text class="ink" x="424" y="66.0" text-anchor="end">100</text>
  <text class="ink" x="652.0" y="278" text-anchor="middle">MNV ALT reads</text>
  <text class="ink" x="384" y="153.0" text-anchor="middle" transform="rotate(-90 384 153.0)">partial allele ALT reads</text>
  <path class="mark" d="M769.5 76 V244"/>
  <text class="ink" x="769.5" y="70" text-anchor="middle">GGG&gt;CAT</text>
  <circle class="dot" cx="769.5" cy="154.6" r="3.5"/>
  <text class="tag" x="777.5" y="158.6">GGG&gt;CAG</text>
  <circle class="dot" cx="769.5" cy="171.9" r="3.5"/>
  <text class="tag" x="777.5" y="175.9">GGG&gt;GAT</text>
  <circle class="dot" cx="769.5" cy="190.6" r="3.5"/>
