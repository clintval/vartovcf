  <path class="band" d="M432.0 244 H595.4 V218.2 H652.8 V198.1 H682.4 V185.3 H702.6 V176.0 H717.9 V168.5 H730.2 V162.4 H740.6 V157.1 H749.4 V152.5 H757.2 V148.4 H764.2 V144.7 H770.4 V141.4 H776.1 V138.3 H781.4 V135.5 H786.2 V132.9 H790.7 V130.4 H794.9 V128.1 H798.8 V125.9 H802.5 V123.9 H806.0 V122.0 H809.4 V120.1 H812.5 V118.4 H815.5 V116.7 H818.4 V115.1 H821.1 V113.6 H823.8 V112.1 H826.3 V110.7 H828.7 V109.4 H831.1 V108.0 H833.3 V106.8 H835.5 V105.6 H837.6 V104.4 H839.7 V103.2 H841.7 V102.1 H843.6 V101.0 H845.4 V100.0 H847.2 V99.0 H849.0 V98.0 H850.7 V97.0 H852.4 V96.1 H854.0 V95.2 H855.6 V94.3 H857.1 V93.4 H858.7 V92.5 H860.1 V91.7 H861.6 V90.9 H863.0 V90.1 H864.4 V89.3 H865.7 V88.5 H867.0 V87.8 H868.3 V87.1 H869.6 V86.3 H870.8 V85.6 H872.0 V244 Z"/>
