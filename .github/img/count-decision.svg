  <path class="axis" d="M432 62 V228 H872"/>
  <text class="ink" x="432.0" y="245" text-anchor="middle">1</text>
  <text class="ink" x="578.7" y="245" text-anchor="middle">10</text>
  <text class="ink" x="725.3" y="245" text-anchor="middle">100</text>
  <text class="ink" x="872.0" y="245" text-anchor="middle">1000</text>
  <text class="ink" x="424" y="220.1" text-anchor="end">1</text>
  <text class="ink" x="424" y="143.0" text-anchor="end">10</text>
  <text class="ink" x="424" y="66.0" text-anchor="end">100</text>
  <text class="ink" x="652.0" y="262" text-anchor="middle">MNV ALT reads</text>
  <text class="ink" x="384" y="145.0" text-anchor="middle" transform="rotate(-90 384 145.0)">partial allele ALT reads</text>
  <path class="mark" d="M769.5 76 V228"/>
  <text class="ink" x="769.5" y="70" text-anchor="middle">GG&gt;CA</text>
  <circle class="dot" cx="769.5" cy="156.1" r="3.5"/>
  <text class="tag" x="777.5" y="160.1">G&gt;C</text>
  <circle class="dot" cx="769.5" cy="169.7" r="3.5"/>
  <text class="tag" x="777.5" y="173.7">G&gt;A</text>
  <text class="ink" x="446" y="72">chance the MNV leaks this many reads or more</text>
  <rect class="band" x="446" y="82" width="22" height="12"/>
  <text class="ink" x="476" y="92">at least 0.05</text>
  <rect class="band" x="446" y="100" width="22" height="12"/>
  <rect class="band" x="446" y="100" width="22" height="12"/>
  <text class="ink" x="476" y="110">at least 0.2</text>
  <rect class="band" x="446" y="118" width="22" height="12"/>
