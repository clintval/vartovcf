<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310" role="img" aria-labelledby="title">
  <title id="title">Deciding a partial allele by its count: the partial allele GGG&gt;CAG with 8 reads folds into the MNV GGG&gt;CAT with 200 reads, while GGG&gt;GAT, with 40 reads, has too many reads to fold and becomes an MNV of its own, taking in GGG&gt;GAG with 3 reads. A partial allele folds when its reads fall below a line that rises with the MNV&#8217;s reads, shaded by the chance the MNV leaks that many reads or more at the rate 0.05.</title>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; }
    .head { fill: #57606a; font-size: 13px; font-weight: 700; }
    .ink { fill: #57606a; font-size: 12.5px; }
    .tag { fill: #57606a; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; }
    .base { fill: #8c8b86; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; }
    .alt { fill: #e34948; font-weight: 700; }
    .nocall { fill: #2a78d6; font-weight: 700; }
    .span { fill: #2a78d6; fill-opacity: 0.12; }
    .arrow { stroke: #8c8b86; stroke-width: 1.5; fill: none; }
    .gap { stroke: #8c8b86; stroke-width: 1.5; stroke-dasharray: 3 3; }
    .read { fill: #8c8b86; fill-opacity: 0.11; }
    .rows { fill: #2a78d6; font-size: 12px; font-weight: 700; }
    .spanned { fill: #12875c; font-size: 12px; font-weight: 700; }
    .none { fill: #e34948; font-size: 12px; font-weight: 700; }
    .vardict { fill: #8c8b86; font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      .head, .ink, .tag { fill: #9198a1; }
      .spanned { fill: #1baf7a; }
      .read { fill: #ffffff; fill-opacity: 0.12; }
    }
    .other { fill: #57606a; font-weight: 700; }
    .moves { fill: #2a78d6; font-size: 12.5px; font-weight: 700; }
    .stays { fill: #57606a; font-size: 12.5px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .other, .stays { fill: #9198a1; }
    }
    .node { fill: #e34948; fill-opacity: 0.12; stroke: #e34948; stroke-width: 1.5; }
    .gray { fill: #8c8b86; fill-opacity: 0.11; stroke: #8c8b86; stroke-width: 1.5; }
    .fold { stroke: #2a78d6; stroke-width: 1.5; fill: none; }
    .band { fill: #2a78d6; fill-opacity: 0.13; }
    .axis { stroke: #8c8b86; stroke-width: 1; fill: none; }
    .mark { stroke: #8c8b86; stroke-width: 1; stroke-dasharray: 3 3; }
    .dot { fill: #e34948; }
    .block { stroke: #e34948; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
    .cross { stroke: #e34948; stroke-width: 2.5; stroke-linecap: round; fill: none; }
    .halt { fill: #e34948; font-size: 12.5px; font-weight: 700; }
  </style>
  <defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2a78d6"/></marker></defs>

  <text class="head" x="20" y="24">1. Calls Beside an MNV</text>
  <text class="ink" x="20" y="42">each circle is a call, sized by its ALT reads</text>
  <text class="ink" x="20" y="298">GGG&gt;GAT is too deep to fold and takes in GGG&gt;GAG</text>
  <circle class="node" cx="80" cy="140" r="50.9"/>
  <text class="base" x="80" y="138" text-anchor="middle">GGG&gt;<tspan class="alt">C</tspan><tspan class="alt">A</tspan><tspan class="alt">T</tspan></text>
  <text class="ink" x="80" y="156" text-anchor="middle">200 reads</text>
  <circle class="node" cx="232" cy="76" r="10.2"/>
  <text class="base" x="250.2" y="75">GGG&gt;<tspan class="alt">C</tspan><tspan class="alt">A</tspan>G</text>
  <text class="ink" x="250.2" y="91">8 reads</text>
  <circle class="node" cx="215" cy="214" r="22.8"/>
  <text class="base" x="215" y="256.8" text-anchor="middle">GGG&gt;G<tspan class="alt">A</tspan><tspan class="alt">T</tspan></text>
  <text class="ink" x="215" y="272.8" text-anchor="middle">40 reads</text>
  <circle class="node" cx="325" cy="214" r="6.2"/>
  <text class="base" x="325" y="240.2" text-anchor="middle">GGG&gt;G<tspan class="alt">A</tspan>G</text>
  <text class="ink" x="325" y="256.2" text-anchor="middle">3 reads</text>
  <path class="fold" d="M218.0 81.9 L131.5 118.3" marker-end="url(#head)"/>
  <text class="moves" x="174.8" y="92.1" text-anchor="middle">folds</text>
  <path class="block" d="M190.6 200.7 L129.0 166.9"/>
  <path class="cross" d="M153.8 177.8 l12 12 m0 -12 l-12 12"/>
  <text class="halt" x="153.8" y="207.8" text-anchor="middle">stays</text>
  <path class="fold" d="M313.8 214.0 L242.8 214.0" marker-end="url(#head)"/>
  <text class="moves" x="278.3" y="206.0" text-anchor="middle">folds</text>

  <text class="head" x="370" y="24">2. Folding by Count</text>
  <text class="ink" x="370" y="42">a partial allele folds below the line, at the default rate of 0.05</text>
  <text class="ink" x="370" y="298">so a real allele with few reads beside a deep MNV folds too</text>
